<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Süper Admin — DadaMutfak</title>
<link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico" />
<!-- FontAwesome 6.5.2 (kilitli ikon seti) -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="assets/css/sa-shell.css" />
</head>
<body data-brand="mutfak" data-sec="genel">

<div class="sa-app">

  <!-- ============ 1) İKON-RAIL (statik; görünürlük/aktiflik JS) ============ -->
  <aside class="sa-rail" id="saRail">
    <a class="sa-rail-logo" href="sa-giris-v1.html" title="Yönetim Girişi">
      <img src="assets/img/logo-mark.png" alt="DadaMutfak" />
    </a>
    <a class="sa-rail-ico" data-sec="genel" href="?sec=genel" title="Genel Bakış"><i class="fa-solid fa-gauge-high"></i></a>
    <span class="sa-rail-div"></span>
    <a class="sa-rail-ico" data-sec="admin"   href="sa-admin.html" title="Admin"><i class="fa-solid fa-shield-halved"></i></a>
    <a class="sa-rail-ico" data-sec="saglik"  href="sa-saglik.html" title="Sağlık & Diyet"><i class="fa-solid fa-heart-pulse"></i></a>
    <a class="sa-rail-ico" data-sec="store"   href="sa-store.html" title="DadaStore"><i class="fa-solid fa-bag-shopping"></i></a>
    <a class="sa-rail-ico" data-sec="dadafit" href="sa-dadafit.html" title="DadaFit"><i class="fa-solid fa-dumbbell"></i></a>
    <a class="sa-rail-ico" data-sec="isletme" href="sa-isletme.html" title="İşletmeler"><i class="fa-solid fa-store"></i></a>
    <a class="sa-rail-ico is-locked" data-sec="akademi" href="?sec=akademi" title="DadaAkademi — Yakında"><i class="fa-solid fa-graduation-cap"></i><i class="fa-solid fa-lock sr-lock"></i></a>
    <div class="sa-rail-foot">
      <a class="sa-rail-ico" href="anasayfa-portal-v3a.html" title="Siteye Dön"><i class="fa-solid fa-arrow-left"></i></a>
    </div>
  </aside>

  <!-- ============ 2) BÖLÜM MENÜSÜ (JS render) ============ -->
  <nav class="sa-menu" id="saMenu"><!-- JS: sa-menu-head + sa-mnav + sa-menu-foot --></nav>

  <!-- divider grip — hover'da belirir; tıkla/sürükle ile menüyü katla/aç (ayrı buton YOK) -->
  <div class="sa-divider" id="saDivider" role="separator" aria-label="Menüyü daralt/genişlet" title="Sürükle veya tıkla — menüyü daralt/genişlet">
    <span class="sa-grip"><i class="fa-solid fa-grip-lines-vertical"></i></span>
  </div>

  <div class="pnl-overlay" id="pnlOverlay"></div>

  <!-- ============ 3) ÜST İNCE BAR ============ -->
  <header class="pnl-top">
    <button class="pnl-burger" id="pnlBurger" aria-label="Menü"><i class="fa-solid fa-bars"></i></button>
    <div class="pnl-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Ara — kullanıcı, içerik, sipariş…" />
    </div>
    <div class="pnl-top-tools">
      <button class="pnl-bell" aria-label="Bildirimler"><i class="fa-regular fa-bell"></i><span class="pb-dot"></span></button>
      <div class="pnl-me">
        <div class="pm-ava"><i class="fa-solid fa-user"></i></div>
        <div class="pm-id">
          <div class="pm-name" id="pmName">Süper Admin</div>
          <div class="pm-role" id="pmRole">Tüm yetki</div>
        </div>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </div>
  </header>

  <!-- ============ İÇERİK (JS render) ============ -->
  <main class="pnl-main" id="saMain"><!-- JS --></main>

</div>

<script src="assets/js/sa-shell.js"></script>
</body>
</html>
